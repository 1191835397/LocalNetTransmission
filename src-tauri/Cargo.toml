[package]
name = "lanlink"
version = "0.1.0"
description = "LanLink 邻传 — 本机安全通信基础"
authors = ["LanLink contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "lanlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
base64 = "=0.22.1"
bytes = "=1.10.1"
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "std"] }
dirs = "=6.0.0"
hostname = "=0.4.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.7.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.17", features = ["tokio"] }
if-addrs = "=0.14.0"
mdns-sd = "=0.21.7"
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls-manual-roots", "json", "stream"] }
ring = "=0.17.14"
futures-util = "=0.3.34"
rustls = { version = "=0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.4"
tempfile = "=3.23.0"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "=0.7.19", features = ["io", "rt"] }
zeroize = { version = "=1.8.2", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_Networking_WinSock", "Wdk_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
